[project]
name = "cortexops-ai-backend"
version = "0.1.0"
description = "Dependency environment for CortexOps AI; application implementation follows setup."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=6,<8",
  "celery[redis]>=5.5,<6",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langchain>=1,<2",
  "langchain-ollama>=1,<2",
  "mcp>=1.12,<2",
  "sentence-transformers>=5,<6",
  "torch>=2.6,<3",
  "qdrant-client>=1.14,<2",
  "fastembed>=0.7,<1",
  "neo4j>=5.28,<7",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
  "structlog>=25,<27",
  "slowapi>=0.1.9,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "pip>=25,<27",
  "pip-licenses>=5,<6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
